<!DOCTYPE html>
<html>
<head>
    <title>Football Hub Pro</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #020617;
            color: white;
        }

        /* NAVBAR */
        .navbar {
            display: flex;
            justify-content: space-between;
            padding: 15px 30px;
            background: #0f172a;
        }

        .logo {
            font-size: 22px;
            color: #00ffcc;
            font-weight: bold;
        }

        .menu a {
            color: white;
            margin-left: 20px;
            text-decoration: none;
        }

        .menu a:hover {
            color: #00ffcc;
        }

        /* HEADER */
        .header {
            text-align: center;
            padding: 30px;
        }

        .header h1 {
            font-size: 40px;
            color: #00ffcc;
        }

        /* SECTION */
        .section {
            padding: 20px 30px;
        }

        .section h2 {
            margin-bottom: 15px;
            color: #00ffcc;
        }

        /* MATCH GRID */
        .matches {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        /* CARD */
        .card {
            background: #111827;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            position: relative;
            transition: 0.3s;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 0 25px #00ffcc44;
        }

        /* LIVE TAG */
        .live {
            position: absolute;
            top: 10px;
            left: 10px;
            background: red;
            padding: 4px 8px;
            font-size: 12px;
            border-radius: 5px;
        }

        /* TEAMS */
        .teams {
            display: flex;
            justify-content: space-around;
            align-items: center;
            margin: 15px 0;
        }

        .team-logo {
            width: 60px;
            height: 60px;
            object-fit: contain;
        }

        /* SCORE */
        .score {
            font-size: 22px;
            font-weight: bold;
        }

        /* TIME */
        .time {
            font-size: 14px;
            color: #ccc;
        }

        /* BUTTON */
        .btn {
            margin-top: 10px;
            padding: 10px;
            border: none;
            background: #00ffcc;
            color: black;
            border-radius: 10px;
            cursor: pointer;
        }

        .btn:hover {
            background: #00ccaa;
        }

        /* RESPONSIVE */
        @media (max-width: 600px) {
            .header h1 {
                font-size: 28px;
            }
        }

    </style>
</head>

<body>

<!-- NAVBAR -->
<div class="navbar">
    <div class="logo">⚽ Football Hub</div>
    <div class="menu">
        <a href="#">Home</a>
        <a href="#">Live</a>
        <a href="#">News</a>
    </div>
</div>

<!-- HEADER -->
<div class="header">
    <h1>Live Matches</h1>
</div>

<!-- MATCHES -->
<div class="section">
    <h2>🔥 Now Playing</h2>

    <div class="matches">

        <!-- MATCH 1 -->
        <div class="card">
            <div class="live">LIVE</div>

            <div class="teams">
                <img src="https://upload.wikimedia.org/wikipedia/en/5/53/Arsenal_FC.svg" class="team-logo">
                <div class="score">2 - 1</div>
                <img src="https://upload.wikimedia.org/wikipedia/en/c/cc/Chelsea_FC.svg" class="team-logo">
            </div>

            <div class="time">75'</div>
            <p>Arsenal vs Chelsea</p>

            <button class="btn">Watch</button>
        </div>

        <!-- MATCH 2 -->
        <div class="card">
            <div class="live">LIVE</div>

            <div class="teams">
                <img src="https://upload.wikimedia.org/wikipedia/en/7/7a/Manchester_United_FC_crest.svg" class="team-logo">
                <div class="score">1 - 1</div>
                <img src="https://upload.wikimedia.org/wikipedia/en/0/0c/Liverpool_FC.svg" class="team-logo">
            </div>

            <div class="time">60'</div>
            <p>Man Utd vs Liverpool</p>

            <button class="btn">Watch</button>
        </div>

        <!-- MATCH 3 (FIXED TEAM) -->
        <div class="card">

            <div class="teams">
                <img src="https://upload.wikimedia.org/wikipedia/en/5/56/Real_Madrid_CF.svg" class="team-logo">
                <div class="score">0 - 0</div>
                <img src="https://upload.wikimedia.org/wikipedia/en/a/a7/Paris_Saint-Germain_F.C..svg" class="team-logo">
            </div>

            <div class="time">Kickoff 8:00PM</div>
            <p>Real Madrid vs PSG</p>

            <button class="btn">Watch</button>
        </div>

    </div>
</div>

<!-- NEWS -->
<div class="section">
    <h2>📰 Latest News</h2>
    <p>Big matches are coming this weekend!</p>
</div>

</body>
</html>
