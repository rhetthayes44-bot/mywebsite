<!DOCTYPE html>
<html>
<head>
    <title>Football Hub</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #020617;
            color: white;
        }

        /* NAVBAR */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
            background: #0f172a;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
            color: #00ffcc;
        }

        .menu a {
            color: white;
            margin-left: 20px;
            text-decoration: none;
        }

        .menu a:hover {
            color: #00ffcc;
        }

        /* HEADER */
        .header {
            text-align: center;
            padding: 30px;
        }

        .header h1 {
            font-size: 40px;
            color: #00ffcc;
        }

        /* SECTION */
        .section {
            padding: 20px 40px;
        }

        .section h2 {
            margin-bottom: 15px;
            color: #00ffcc;
        }

        /* MATCH CARDS */
        .matches {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .card {
            background: #111827;
            padding: 20px;
            border-radius: 15px;
            width: 250px;
            text-align: center;
            transition: 0.3s;
            position: relative;
        }

        .card:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px #00ffcc55;
        }

        .live {
            position: absolute;
            top: 10px;
            left: 10px;
            background: red;
            padding: 3px 8px;
            font-size: 12px;
            border-radius: 5px;
        }

        .team-logo {
            width: 60px;
            height: 60px;
        }

        .vs {
            margin: 10px 0;
            font-weight: bold;
        }

        /* BUTTON */
        .btn {
            margin-top: 15px;
            padding: 10px;
            border: none;
            background: #00ffcc;
            color: black;
            border-radius: 10px;
            cursor: pointer;
        }

        .btn:hover {
            background: #00ccaa;
        }

    </style>
</head>

<body>

<!-- NAVBAR -->
<div class="navbar">
    <div class="logo">⚽ Football Hub</div>
    <div class="menu">
        <a href="#">Home</a>
        <a href="#">Matches</a>
        <a href="#">News</a>
    </div>
</div>

<!-- HEADER -->
<div class="header">
    <h1>Live Matches & Updates</h1>
</div>

<!-- LIVE MATCHES -->
<div class="section">
    <h2>🔥 Live Matches</h2>

    <div class="matches">

        <!-- Match 1 -->
        <div class="card">
            <div class="live">LIVE</div>
            <img src="https://upload.wikimedia.org/wikipedia/en/5/53/Arsenal_FC.svg" class="team-logo">
            <div class="vs">VS</div>
            <img src="https://upload.wikimedia.org/wikipedia/en/c/cc/Chelsea_FC.svg" class="team-logo">
            <p>Arsenal vs Chelsea</p>
            <button class="btn">Watch</button>
        </div>

        <!-- Match 2 -->
        <div class="card">
            <div class="live">LIVE</div>
            <img src="https://upload.wikimedia.org/wikipedia/en/7/7a/Manchester_United_FC_crest.svg" class="team-logo">
            <div class="vs">VS</div>
            <img src="https://upload.wikimedia.org/wikipedia/en/0/0c/Liverpool_FC.svg" class="team-logo">
            <p>Man Utd vs Liverpool</p>
            <button class="btn">Watch</button>
        </div>

        <!-- Match 3 (FIXED BAYERN) -->
        <div class="card">
            <img src="https://upload.wikimedia.org/wikipedia/commons/1/1f/FC_Bayern_Munich_logo_%282017%29.svg" class="team-logo">
            <div class="vs">VS</div>
            <img src="https://upload.wikimedia.org/wikipedia/en/a/a7/Paris_Saint-Germain_F.C..svg" class="team-logo">
            <p>Bayern vs PSG</p>
            <button class="btn">Watch</button>
        </div>

    </div>
</div>

<!-- NEWS -->
<div class="section">
    <h2>📰 Latest News</h2>
    <p>Big matches are coming this weekend!</p>
</div>

</body>
</html>
